# ===========================================================================
# Emotion -> voice style mapping
# ===========================================================================
# This file is the single source of truth for emotional presentation.
# Upstream owns emotion classification; this layer only maps the supplied tag.
#
# Canonical fields:
#   label / tone / description : shown to the user and logged as structured data
#   speed                      : canonical multiplier (0.5 .. 2.0)
#   pitch_semitones            : canonical pitch shift (-12 .. 12)
#   volume_db                  : canonical volume shift (-12 .. 6)
#   aliases                    : accepted upstream tags, normalized to lowercase
#   provider_overrides         : vendor-specific direction. All fields optional.
#
# Adapter precedence:
#   provider_overrides.<provider> > this file's canonical values > app.yaml voice
#
# See docs/DEVELOPER_GUIDE.md for the full schema and validation rules.
# ===========================================================================
version: 1
