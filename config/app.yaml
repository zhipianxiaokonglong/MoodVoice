# MoodVoice runtime configuration.
# Secret values belong in .env, never in this file.

app:
  name: "MoodVoice"
  version: "1.0.0"
  language: "zh-CN"
  max_input_chars: 8000
  # Speech text is capped independently from rendered text.
  max_tts_chars: 3000

server:
  # Keep loopback-only unless you have added your own access control.
  host: "127.0.0.1"
  port: 8765

tts:
  # auto | edge | openai | elevenlabs | azure | minimax | deepseek | local
  provider: "auto"
  # Explicit opt-in fallback chain. Empty means: provider failure -> plain text.
  # Cross-provider fallback sends the same text to these providers; list only
  # vendors you have configured and are comfortable sending text to.
  fallback_providers: []
  first_chunk_timeout_seconds: 20
  total_timeout_seconds: 60
  # Auto mode picks the first ready provider in this order.
  auto_order:
    - "azure"
    - "openai"
    - "elevenlabs"
    - "minimax"
    - "deepseek"
    - "local"
    - "edge"
  cache:
    max_files: 200
    max_age_hours: 168
  data_dir: ".data"
  styles_file: "config/emotion_styles.yaml"
  routes_file: "config/routes.yaml"

  # Provider-neutral speech shaping. Providers decide how to realize it:
  # Azure SSML breaks, Edge rate/pitch/volume, OpenAI instructions, DeepSeek
  # plain text or optional segment splicing, local style payload.
  speech:
    preserve_paragraphs: true
    sentence_pause_ms: 80
    paragraph_pause_ms: 350
    list_group_size: 3
    min_segment_chars: 8
    max_planned_segments: 6
    # Off by default; enable only after real listening validation.
    segmentation_enabled: false
    segmentation_min_chars: 240
    max_segments: 4
    segment_concurrency: 2
    segment_first_chunk_timeout_seconds: 30
    segment_pause_ms: 320
    crossfade_ms: 30

providers:
  # Free, keyless demo channel. edge-tts is an online Microsoft service:
  # text leaves this machine. For fully local speech, use providers.local.
  # Set enabled: false if this deployment must have zero external egress.
  edge:
    enabled: true
    voice: "zh-CN-XiaoxiaoNeural"

  openai:
    enabled: true
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini-tts"
    voice: "coral"
    response_format: "mp3"

  elevenlabs:
    enabled: true
    base_url: "https://api.elevenlabs.io/v1"
    model_id: "eleven_multilingual_v2"
    # Fill this in config (not a secret) after choosing a voice.
    voice_id: ""
    output_format: "mp3_44100_128"

  azure:
    enabled: true
    # Region may also be supplied with AZURE_SPEECH_REGION.
    region: ""
    voice: "zh-CN-XiaoxiaoNeural"
    output_format: "audio-24khz-48kbitrate-mono-mp3"

  minimax:
    enabled: true
    base_url: "https://api.minimax.chat/v1/t2a_v2"
    model: "speech-02-hd"
    voice_id: "female-shaonv"
    group_id: ""
    # "Chinese" / "English" / "auto" — MiniMax language_boost.
    language_boost: "Chinese"

  deepseek:
    enabled: true
    # DeepSeek 工具 API（2026-11 起提供 ASR/TTS）；密钥为 DEEPSEEK_API_KEY。
    base_url: "https://api.deepseek.com"
    voice_id: "stella"          # stella（女声）| tide（男声）
    format: "wav"
    # We already clean Markdown in rendering.py, so do not let the vendor
    # collapse paragraph breaks a second time.
    filter_markdown: false

  local:
    enabled: true
    # Exact endpoint implementing the local adapter contract.
    base_url: ""
    voice: "default"
    format: "wav"
