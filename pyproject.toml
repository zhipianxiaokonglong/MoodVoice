[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moodvoice-emotional-tts"
version = "1.0.0"
description = "A tag-driven emotional TTS output layer with pluggable providers and text fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MoodVoice Team" }]
keywords = ["tts", "emotion", "voice", "llm", "fastapi"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "edge-tts>=7,<8",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
moodvoice = "emotional_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emotional_tts = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "live: tests that call a real external TTS provider (disabled by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the default safety checks focused on correctness and imports. Broad
# exception handling at the WebSocket/storage boundary is intentional and
# audited in code comments; see security.py for log redaction.
select = ["E", "F", "I", "UP", "B", "SIM"]
# Cleanup paths intentionally swallow close/consume errors; the writer keeps a
# file handle open across chunks, so the context-manager suggestion does not fit.
ignore = ["SIM105", "SIM115"]
